<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8F94;stop-opacity:1" />
    </linearGradient>
    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" rx="12" fill="url(#bg_grad)"/>
  <rect x="0" y="34" width="1000" height="266" fill="url(#dotgrid)"/>

  <!-- Window chrome -->
  <rect x="0" y="0" width="1000" height="34" rx="12" fill="#161B22"/>
  <circle cx="24" cy="17" r="5" fill="#FFFFFF" fill-opacity="0.25"/>
  <circle cx="42" cy="17" r="5" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="60" cy="17" r="5" fill="#FFFFFF" fill-opacity="0.75"/>
  <text x="86" y="22" font-family="monospace" font-size="13" fill="#FFFFFF" fill-opacity="0.45">gabriel@dev:~$ whoami</text>
  <line x1="0" y1="34" x2="1000" y2="34" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Prompt -->
  <text x="50" y="100" font-family="monospace" font-size="16" fill="#FFFFFF" fill-opacity="0.5">$ whoami</text>

  <!-- Main Name -->
  <text x="48" y="168" font-family="'Inter', sans-serif, Arial" font-size="68" font-weight="900" fill="url(#text_grad)" style="letter-spacing: -2px;">
    Gabriel Rodrigues
  </text>

  <!-- Role & Subtitle -->
  <text x="52" y="204" font-family="monospace" font-size="18" fill="white" fill-opacity="0.6" font-weight="400">
    &gt; Full Stack Developer — Cloud &amp; DevOps Enthusiast
  </text>
  <rect x="602" y="188" width="9" height="20" fill="#FFFFFF"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>

  <!-- Status pills -->
  
  <rect x="52" y="232" width="96" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="100" y="250" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.85" font-weight="bold" style="letter-spacing: 1px;">[ONLINE]</text>
  
  <rect x="160" y="232" width="160" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="240" y="250" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.85" font-weight="bold" style="letter-spacing: 1px;">[OPEN_TO_WORK]</text>
  
  <rect x="332" y="232" width="260" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="462" y="250" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.85" font-weight="bold" style="letter-spacing: 1px;">[STACK: JS/TS · PY · AWS]</text>

  <!-- Accent line -->
  <rect x="52" y="276" width="60" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.5"/>
</svg>

