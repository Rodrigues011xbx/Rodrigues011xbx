  <text x="20" y="130" font-family="Arial" font-size="14" fill="white" fill-opacity="0.6">Focus: AWS, Pulumi (IaC) &amp;</text>
  <text x="20" y="150" font-family="Arial" font-size="14" fill="white" fill-opacity="0.6">CI/CD Pipelines.</text>

  <rect x="20" y="165" width="120" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.4"/>
  <text x="80" y="182" text-anchor="middle" font-family="Arial" font-size="10" fill="#FFFFFF" font-weight="bold">IN PROGRESS</text>
</svg>

