<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" rx="15" fill="#161B22" stroke="#FFFFFF" stroke-opacity="0.2"/>

  <text x="20" y="35" font-family="Arial" font-size="12" fill="#FFFFFF" fill-opacity="0.85" font-weight="bold" style="letter-spacing: 2px;">CURRENT MISSION</text>

  <!-- Text Content -->
  <text x="20" y="70" font-family="Arial" font-size="17" fill="white" font-weight="bold">Mastering Cloud &amp;</text>
  <text x="20" y="95" font-family="Arial" font-size="17" fill="white" font-weight="bold">Backend Systems</text>

  <!-- Circular Progress -->
  <g transform="translate(310, 100)">
    <circle cx="0" cy="0" r="60" stroke="#0D1117" stroke-width="12" fill="none"/>
