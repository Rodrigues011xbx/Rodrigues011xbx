<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" rx="15" fill="#0D1117" stroke="#FFFFFF" stroke-opacity="0.3"/>
  <rect x="10" y="10" width="780" height="430" rx="10" fill="#161B22"/>

  <!-- Left Side: Radar Chart Simulation -->
  <path d="M150 100 L250 150 L200 250 L100 250 L50 150 Z" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="2" filter="url(#neon)"/>
  <circle cx="150" cy="180" r="80" stroke="white" stroke-opacity="0.1" fill="none"/>
  <circle cx="150" cy="180" r="40" stroke="white" stroke-opacity="0.1" fill="none"/>

  <!-- Labels for Radar -->
  <text x="150" y="90" text-anchor="middle" font-family="Arial" font-size="10" fill="white" fill-opacity="0.6">FRONTEND</text>
  <text x="270" y="155" text-anchor="start" font-family="Arial" font-size="10" fill="white" fill-opacity="0.6">BACKEND</text>
  <text x="210" y="270" text-anchor="middle" font-family="Arial" font-size="10" fill="white" fill-opacity="0.6">DATABASE</text>
  <text x="90" y="270" text-anchor="middle" font-family="Arial" font-size="10" fill="white" fill-opacity="0.6">DESIGN</text>
  <text x="30" y="155" text-anchor="end" font-family="Arial" font-size="10" fill="white" fill-opacity="0.6">LOGIC</text>

  <!-- Badge below radar -->
  <rect x="90" y="300" width="120" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.4"/>
  <text x="150" y="315" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="bold" style="letter-spacing: 1px;">+ CLOUD UNLOCKED</text>

  <!-- Right Side: Vertical Stat Bars -->
  <g transform="translate(350, 60)">
    <text x="0" y="0" font-family="Arial" font-size="12" fill="#FFFFFF" fill-opacity="0.85" font-weight="bold" style="letter-spacing: 2px;">STRENGTH (JS/TS)</text>
    <rect x="0" y="10" width="400" height="8" rx="4" fill="#0D1117"/>
    <rect x="0" y="10" width="350" height="8" rx="4" fill="#FFFFFF" filter="url(#neon)"/>
    <text x="410" y="18" font-family="Arial" font-size="10" fill="white">92%</text>

    <text x="0" y="50" font-family="Arial" font-size="12" fill="#FFFFFF" fill-opacity="0.7" font-weight="bold" style="letter-spacing: 2px;">AGILITY (PYTHON)</text>
    <rect x="0" y="60" width="400" height="8" rx="4" fill="#0D1117"/>
    <rect x="0" y="60" width="320" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.85" filter="url(#neon)"/>
    <text x="410" y="68" font-family="Arial" font-size="10" fill="white">85%</text>

    <text x="0" y="100" font-family="Arial" font-size="12" fill="#FFFFFF" fill-opacity="0.55" font-weight="bold" style="letter-spacing: 2px;">INTELLIGENCE (SQL)</text>
    <rect x="0" y="110" width="400" height="8" rx="4" fill="#0D1117"/>
    <rect x="0" y="110" width="300" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.7" filter="url(#neon)"/>
    <text x="410" y="118" font-family="Arial" font-size="10" fill="white">78%</text>

    <text x="0" y="150" font-family="Arial" font-size="12" fill="#FFFFFF" fill-opacity="0.75" font-weight="bold" style="letter-spacing: 2px;">SENSE (UI/UX)</text>
    <rect x="0" y="160" width="400" height="8" rx="4" fill="#0D1117"/>
    <rect x="0" y="160" width="340" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.8" filter="url(#neon)"/>
    <text x="410" y="168" font-family="Arial" font-size="10" fill="white">88%</text>

    <text x="0" y="200" font-family="Arial" font-size="12" fill="#FFFFFF" fill-opacity="0.95" font-weight="bold" style="letter-spacing: 2px;">VITALITY (AWS/CLOUD)</text>
    <rect x="0" y="210" width="400" height="8" rx="4" fill="#0D1117"/>
    <rect x="0" y="210" width="288" height="8" rx="4" fill="#FFFFFF" filter="url(#neon)"/>
    <text x="410" y="218" font-family="Arial" font-size="10" fill="white">72%</text>
  </g>

  <!-- Bottom: System Status -->
  <text x="400" y="400" text-anchor="middle" font-family="monospace" font-size="14" fill="#FFFFFF" fill-opacity="0.85">&gt;&gt; SYSTEM_SCAN_COMPLETE: ALL_STATS_SYNCHRONIZED</text>
</svg>

